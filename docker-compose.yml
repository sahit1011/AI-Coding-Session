version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: dexicon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dexicon_backend
    ports:
      - "8001:8001"
    environment:
      - SEARCH_MODE=${SEARCH_MODE:-enhanced}
      - CACHE_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - FORCE_REINDEX=false
      - CHROMA_DB_PATH=/app/chroma_db
    volumes:
      - ./data:/app/data:ro
      - chroma_db_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dexicon_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  chroma_db_data:

